name: Daily dashboard update

on:
  schedule:
    - cron: "15 7 * * *"
      timezone: "America/Indiana/Indianapolis"
  workflow_dispatch:

concurrency:
  group: bennett-dashboard-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Run scoring regression tests
        run: node scripts/test-dashboard-v5.mjs

      - name: Research and update dashboard
        id: dashboard_update
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/update-dashboard.mjs

      - name: Commit dashboard and audit state
        if: always()
        run: |
          git config user.name "bennett-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.json
          if [ -f api-budget.json ]; then git add api-budget.json; fi
          if [ -f update-status.json ]; then git add update-status.json; fi
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Daily preparedness dashboard update"
            git push
          fi

      - name: Mark failed research as workflow failure
        if: steps.dashboard_update.outcome == 'failure'
        run: |
          echo "The updater failed safely. dashboard.json was preserved; see update-status.json for the reason."
          exit 1

  deploy:
    name: Deploy dashboard to GitHub Pages
    needs: update
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out latest dashboard state
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static dashboard site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html dashboard.json _site/
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
