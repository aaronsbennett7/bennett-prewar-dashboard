name: Daily dashboard update

on:
  schedule:
    - cron: "15 7 * * *"
      timezone: "America/Indiana/Indianapolis"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Research and update dashboard
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/update-dashboard.mjs

      - name: Commit updated data
        run: |
          git config user.name "bennett-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.json
          if git diff --cached --quiet; then
            echo "No dashboard changes."
          else
            git commit -m "Daily escalation dashboard update"
            git push
          fi
